<style>
:root{--bg:#0a0a0a;--sf:#111;--hover:#161616;--line:#242424;--text:#ededed;--dim:#8f8f8f;--mute:#5c5c5c;--head:#fff;--g:#00ff87;--bad:#ff5c7a;--scrim:rgba(0,0,0,.7);--inv:#0a0a0a;--sh:0 12px 40px rgba(0,0,0,.5);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#fff;--sf:#fafafa;--hover:#f4f4f4;--line:#e6e6e6;--text:#262626;--dim:#6b6b6b;--mute:#a3a3a3;--head:#000;--g:#0a8a4f;--bad:#d1304f;--scrim:rgba(255,255,255,.75);--inv:#fff;--sh:0 12px 40px rgba(0,0,0,.12);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
::selection{background:var(--g);color:var(--inv)}
a{color:inherit}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.ni{max-width:880px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--head)}
.logo{width:22px;height:22px;border-radius:6px;background:var(--g);color:var(--inv);display:grid;place-items:center;font:600 12px 'JetBrains Mono',monospace}
.sl{color:var(--mute);font-weight:400}.cur{color:var(--dim);font-weight:400}
.nr{display:flex;align-items:center;gap:14px;font-size:13px}
.nr a{color:var(--dim);text-decoration:none}.nr a:hover{color:var(--head)}
.ic{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0}
.ic:hover{color:var(--head);background:var(--hover)}
[data-theme=dark] .moon,[data-theme=light] .sun{display:none}
.wrap{max-width:880px;margin:0 auto;padding:60px 20px 80px}
h1{font:600 clamp(32px,5vw,44px)/1.1 Inter,system-ui,sans-serif;letter-spacing:-.035em;color:var(--head);margin:0 0 12px}
.lede{font-size:16px;color:var(--dim);max-width:52ch;margin:0 0 32px}
.sr{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--sf);border:1px solid var(--line);border-radius:10px;color:var(--dim)}
.sr:focus-within{border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 16%,transparent)}
.sr input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--head);font:inherit;font-size:15px}
.sr input::placeholder{color:var(--mute)}
kbd{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font:12px 'JetBrains Mono',monospace;color:var(--dim)}
.flt{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.flt button{height:30px;padding:0 12px;border-radius:8px;border:1px solid transparent;background:none;color:var(--dim);font:inherit;font-size:13px;cursor:pointer;text-transform:capitalize}
.flt button:hover{color:var(--head)}
.flt button.on{background:var(--sf);border-color:var(--line);color:var(--head)}
.flt.tg button{font:12px 'JetBrains Mono',monospace;height:26px;padding:0 9px;text-transform:none}
.flt.tg button.on{color:var(--g);border-color:var(--g);background:none}
.flt .lb{font:12px/26px 'JetBrains Mono',monospace;color:var(--mute);margin-right:4px}
.tb{display:flex;justify-content:space-between;align-items:center;margin:34px 0 4px;color:var(--dim);font-size:13px;min-height:32px}
.acts{display:flex;gap:8px}
.lk{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;padding:0;cursor:pointer}
.lk:hover{color:var(--head)}.lk.d:hover{color:var(--bad)}
.acts .lk{border:1px solid var(--line);border-radius:8px;padding:5px 12px;color:var(--text)}
.acts .lk:hover{background:var(--hover)}
.acts #add{background:var(--head);color:var(--inv);border-color:var(--head);font-weight:500}.acts #add:hover{opacity:.88;background:var(--head)}
body:not(.admin) .acts,body:not(.admin) .ca{display:none}
h2{font:500 12px/1 Inter,sans-serif;color:var(--dim);letter-spacing:.03em;margin:26px 0 10px}
.lst{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:grid;grid-template-columns:104px 1fr auto auto auto;gap:16px;align-items:center;padding:14px 16px;color:inherit;text-decoration:none;border-top:1px solid var(--line);transition:background .12s}
.it:first-child{border-top:0}.it:hover{background:var(--hover)}
.ty{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 'JetBrains Mono',monospace;color:var(--dim)}
.ty::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--k)}
.bd b{display:block;font-weight:500;font-size:14.5px;color:var(--head)}
.bd b::after{content:"\2197";margin-left:6px;color:var(--dim);opacity:0;transition:opacity .12s}
.it:hover .bd b::after{opacity:1}
.bd small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.tags{display:flex;gap:6px}
.tags i{font:12px/1.6 'JetBrains Mono',monospace;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 7px}
.dt{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.ca{display:flex;gap:12px}
.empty{padding:56px 0;text-align:center;color:var(--dim)}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:720px){.it{grid-template-columns:1fr;gap:6px}.tags,.dt{display:none}.sr kbd{display:none}.wrap{padding-top:40px}.brand .sl,.brand .cur{display:none}}
.ov{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.ov.on{display:flex}
.md{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:22px}
.md h3{margin:0 0 4px;font:600 18px Inter,sans-serif;color:var(--head);letter-spacing:-.01em}
.md label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px}
.md input,.md select,.md textarea{width:100%;background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;color:var(--text);outline:0}
.md input:focus,.md select:focus,.md textarea:focus{border-color:var(--g)}
.md textarea{min-height:68px;resize:vertical}
.md .chk{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--text)}.md .chk input{width:auto}
.mb{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:20px}
.mb .pri{background:var(--head);color:var(--inv);border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:500;cursor:pointer}
.mb .pri:disabled{opacity:.5}
.er{color:var(--bad);font-size:12px;margin-right:auto}.fn{font-size:12px;color:var(--dim);margin-top:4px}

/* footer */
footer.ft{display:block;margin-top:64px;padding-top:24px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}
.ft-main{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ft-soc{display:flex;gap:8px}
.ft-soc a{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;color:var(--dim);transition:.15s}
.ft-mail{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font-size:13px;transition:.15s;max-width:100%}
.ft-mail span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft-soc a:hover,.ft-mail:hover{color:var(--g);border-color:var(--g);background:var(--hover)}
.ft-base{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
@media(max-width:560px){.ft-main{flex-direction:column;align-items:stretch}.ft-soc{justify-content:space-between}.ft-soc a{flex:1;width:auto}.ft-mail{justify-content:center}.ft-base{flex-direction:column;gap:6px}.ft .hint{display:none}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ── SEED: your public notes. type: doc | file | link | repo | cheatsheet ── */
const SEED = [
  {title:"DBMS Complete Notes",type:"doc",url:"#",desc:"ER models, normalization, transactions, indexing.",tags:["dbms","sql","college"],date:"2026-09-12",pin:true},
  {title:"Software Engineering Unit Notes",type:"file",url:"#",desc:"SDLC, UML, testing. Exam-ready PDF.",tags:["se","college"],date:"2026-08-30"},
  {title:"SQL Cheatsheet",type:"cheatsheet",url:"#",desc:"Joins, window functions, CTEs, common patterns.",tags:["sql","dbms"],date:"2026-09-02",pin:true},
  {title:"DSA Patterns Sheet",type:"cheatsheet",url:"#",desc:"Two pointers, sliding window, DP, graphs, with problem links.",tags:["dsa","cp"],date:"2026-10-01",pin:true},
  {title:"LeetCode / Codeforces Tracker",type:"link",url:"#",desc:"Solved list and weak-topic log.",tags:["dsa","cp"],date:"2026-10-05"},
  {title:"LangChain + FastAPI Starter",type:"repo",url:"https://github.com/uddhav05-cyber",desc:"Agent scaffolding I reuse for new projects.",tags:["ai","agents","python"],date:"2026-09-20"},
  {title:"ML Classifier Notes",type:"doc",url:"#",desc:"Metrics, overfitting, pipelines, model selection.",tags:["ml","python"],date:"2026-08-14"},
  {title:"Android Kotlin Lab Manual",type:"file",url:"#",desc:"Activities, intents, RecyclerView, Room.",tags:["android","kotlin","college"],date:"2026-07-22"},
  {title:"Next.js Snippets",type:"cheatsheet",url:"#",desc:"App router, API routes, metadata, deployment.",tags:["web","react"],date:"2026-10-07"},
  {title:"Microsoft Learn Paths",type:"link",url:"https://learn.microsoft.com",desc:"Azure and AI learning paths worth finishing.",tags:["azure","ai","learning"],date:"2026-07-10"},
  {title:"Git Commands I Forget",type:"cheatsheet",url:"#",desc:"Rebase, stash, reflog, cherry-pick.",tags:["git","tools"],date:"2026-08-03"}
];
/* ─────────────────────────────────────────────────────────────────────── */
const $=s=>document.querySelector(s);
let fType="all",fTag=null,q="";
const uniq=a=>[...new Set(a)];
const rid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ── CLOUD CONFIG (Supabase). Leave both empty to run in local-only demo mode ── */
const SB_URL="https://ttmivuvwozqduuuaalmp.supabase.co", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0bWl2dXZ3b3pxZHV1dWFhbG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0ODMwNTcsImV4cCI6MjEwODA1OTA1N30.tGcmNPPUhJoDAqdD4Z-rjPAz1TEU09MVt1iZS86rIgw";
/* ─────────────────────────────────────────────────────────────────────────── */
const sb=(SB_URL&&SB_KEY&&window.supabase)?supabase.createClient(SB_URL,SB_KEY):null;
const KEY="notes.v1";
let NOTES=[];
const norm=r=>({id:r.id,title:r.title,type:r.type||"doc",url:r.url||"#",desc:r.descr||"",tags:r.tags||[],pin:!!r.pin,date:(r.created_at||"").slice(0,10),file:r.file_url||null,fname:r.fname||null});
const toRow=n=>({title:n.title,type:n.type,url:n.url,descr:n.desc,tags:n.tags,pin:n.pin,file_url:n.file||null,fname:n.fname||null});
const save=()=>{if(sb)return true;try{localStorage.setItem(KEY,JSON.stringify(NOTES));return true}catch(e){return false}};
function setAdmin(on){document.body.classList.toggle("admin",on);$("#lg").textContent=on?"sign out":"admin"}
async function load(){
  if(sb){
    $("#data").style.display="none";
    const r=await sb.from("notes").select("*").order("created_at",{ascending:false});
    if(!r.error&&r.data)NOTES=r.data.map(norm);
    const s=await sb.auth.getSession();setAdmin(!!s.data.session);
    if(!s.data.session&&location.hash==="#admin")lo.classList.add("on");
  }else{
    try{NOTES=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    if(!Array.isArray(NOTES))NOTES=SEED.map(n=>({...n}));
    NOTES.forEach(n=>{n.id=n.id||rid();n.tags=n.tags||[]});
    try{if(location.hash==="#admin")localStorage.setItem("notes.admin","1");setAdmin(!!localStorage.getItem("notes.admin"))}catch(e){}
  }
  render();
}

function flt(el,list,cur,fn,label){
  el.innerHTML=(label?`<span class="lb">${label}</span>`:"")+list.map(v=>`<button class="${v===cur?'on':''}" data-v="${esc(v)}">${label?'#':''}${esc(v)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("button");if(b)fn(b.dataset.v)};
}
const KC={doc:"#3b82f6",file:"#f59e0b",link:"#10b981",repo:"#a855f7",cheatsheet:"#ec4899"};
function row(n){
  const ext=n.url&&n.url!=="#"&&!n.file;
  return `<a class="it" href="${esc(n.file||n.url||"#")}" ${n.file?`download="${esc(n.fname)}"`:ext?'target="_blank" rel="noopener"':''}>
    <span class="ty" style="--k:${KC[n.type]||"#888"}">${esc(n.type)}</span>
    <span class="bd"><b>${esc(n.title)}</b><small>${esc(n.desc)}</small></span>
    <span class="tags">${n.tags.map(t=>`<i>${esc(t)}</i>`).join("")}</span>
    <span class="dt">${esc(n.date)}</span>
    <span class="ca"><button class="lk" data-a="e" data-id="${n.id}">Edit</button><button class="lk d" data-a="d" data-id="${n.id}">Delete</button></span>
  </a>`;
}
function render(){
  flt($("#types"),["all",...uniq(NOTES.map(n=>n.type))],fType,v=>{fType=v;render()});
  flt($("#tags"),uniq(NOTES.flatMap(n=>n.tags)).sort(),fTag,v=>{fTag=fTag===v?null:v;render()},"tags");
  const s=q.toLowerCase();
  const list=NOTES.filter(n=>(fType==="all"||n.type===fType)&&(!fTag||n.tags.includes(fTag))&&(!s||(n.title+n.desc+n.type+n.tags.join(" ")).toLowerCase().includes(s)))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  $("#meta").textContent=`${list.length} of ${NOTES.length} notes`;
  if(!list.length){$("#out").innerHTML='<div class="empty">No notes found.</div>';return}
  const filtering=s||fTag||fType!=="all";
  const pinned=filtering?[]:list.filter(n=>n.pin);
  const rest=filtering?list:list.filter(n=>!n.pin);
  $("#out").innerHTML=(pinned.length?`<h2>Pinned</h2><div class="lst">${pinned.map(row).join("")}</div>`:"")+
    (rest.length?`<h2>${filtering?"Results":"All notes"}</h2><div class="lst">${rest.map(row).join("")}</div>`:"");
}
$("#q").addEventListener("input",e=>{q=e.target.value;render()});
document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==="Escape"){if(ov.classList.contains("on")||dv.classList.contains("on")||lo.classList.contains("on")){closeAll();return}$("#q").value="";q="";fTag=null;fType="all";$("#q").blur();render();return}
  if(typing)return;
  if(e.key==="t")flip();
  if(e.key==="/"){e.preventDefault();$("#q").focus()}
  if(e.key==="n"&&document.body.classList.contains("admin")){e.preventDefault();openForm()}
});

const ov=$("#ov"),dv=$("#dv"),lo=$("#lo");let editId=null;
function closeAll(){ov.classList.remove("on");dv.classList.remove("on");lo.classList.remove("on")}
function openForm(id){
  editId=id||null;const n=NOTES.find(x=>x.id===id)||{type:"doc",tags:[]};
  $("#fh").textContent=id?"Edit note":"New note";
  $("#f-title").value=n.title||"";$("#f-type").value=n.type;$("#f-url").value=n.url&&n.url!=="#"?n.url:"";
  $("#f-file").value="";$("#fn").textContent=n.fname?"attached: "+n.fname+" (pick a file to replace)":"";
  $("#f-desc").value=n.desc||"";$("#f-tags").value=(n.tags||[]).join(", ");$("#f-pin").checked=!!n.pin;$("#err").textContent="";
  ov.classList.add("on");$("#f-title").focus();
}
$("#f-save").onclick=async()=>{
  const title=$("#f-title").value.trim();
  if(!title){$("#err").textContent="title required";return}
  const f=$("#f-file").files[0];
  if(f&&f.size>(sb?5e7:1.2e6)){$("#err").textContent=sb?"file over 50MB, use a link":"file over 1.2MB, use a Drive link";return}
  const old=NOTES.find(x=>x.id===editId);
  const n={...(old||{}),id:old?old.id:rid(),title,type:$("#f-type").value,url:$("#f-url").value.trim()||"#",desc:$("#f-desc").value.trim(),tags:$("#f-tags").value.split(",").map(t=>t.trim().toLowerCase().replace(/^#/,"")).filter(Boolean),pin:$("#f-pin").checked,date:old?old.date:new Date().toISOString().slice(0,10)};
  const btn=$("#f-save");btn.disabled=true;
  try{
    if(sb){
      if(f){const p=rid()+"-"+f.name.replace(/[^\w.\-]/g,"_");const u=await sb.storage.from("notes").upload(p,f);if(u.error)throw u.error;n.file=sb.storage.from("notes").getPublicUrl(p).data.publicUrl;n.fname=f.name}
      const r=old?await sb.from("notes").update(toRow(n)).eq("id",old.id):await sb.from("notes").insert(toRow(n));
      if(r.error)throw r.error;
      await load();
    }else{
      if(f){n.file=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});n.fname=f.name}
      const prev=NOTES.slice();
      if(old)NOTES[NOTES.indexOf(old)]=n;else NOTES.unshift(n);
      if(!save()){NOTES=prev;throw new Error("storage full, use a link")}
      render();
    }
    closeAll();
  }catch(e){$("#err").textContent=e.message||"failed"}
  btn.disabled=false;
};
$("#add").onclick=()=>openForm();
$("#data").onclick=()=>{$("#dj").value=JSON.stringify(NOTES,null,1);$("#derr").textContent="";dv.classList.add("on")};
$("#d-copy").onclick=()=>{$("#dj").select();try{document.execCommand("copy");$("#derr").textContent="copied"}catch(e){$("#derr").textContent="select and copy manually"}};
$("#d-imp").onclick=()=>{try{const a=JSON.parse($("#dj").value);if(!Array.isArray(a))throw 0;a.forEach(n=>{n.id=n.id||rid();n.tags=n.tags||[]});const p=NOTES;NOTES=a;if(!save()){NOTES=p;$("#derr").textContent="storage full";return}closeAll();render()}catch(e){$("#derr").textContent="invalid JSON"}};
$("#d-reset").onclick=function(){if(this.dataset.s){NOTES=SEED.map(n=>({...n,id:rid()}));save();closeAll();render();this.dataset.s="";this.textContent="reset"}else{this.dataset.s=1;this.textContent="sure?";setTimeout(()=>{this.dataset.s="";this.textContent="reset"},2500)}};
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeAll);
[ov,dv,lo].forEach(o=>o.addEventListener("mousedown",e=>{if(e.target===o)closeAll()}));
$("#out").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  e.preventDefault();e.stopPropagation();
  const id=b.dataset.id;
  if(b.dataset.a==="e")return openForm(id);
  if(b.dataset.s){if(sb){sb.from("notes").delete().eq("id",id).then(load)}else{NOTES=NOTES.filter(n=>n.id!==id);save();render()}}
  else{b.dataset.s=1;b.textContent="sure?";setTimeout(()=>{b.dataset.s="";b.textContent="Delete"},2500)}
});
$("#lg").onclick=async()=>{
  const on=document.body.classList.contains("admin");
  if(!sb){try{on?localStorage.removeItem("notes.admin"):localStorage.setItem("notes.admin","1")}catch(e){}setAdmin(!on);return}
  if(on){await sb.auth.signOut();setAdmin(false)}else{$("#lerr").textContent="";lo.classList.add("on");$("#l-e").focus()}
};
$("#l-go").onclick=async()=>{
  const r=await sb.auth.signInWithPassword({email:$("#l-e").value.trim(),password:$("#l-p").value});
  if(r.error){$("#lerr").textContent=r.error.message;return}
  closeAll();setAdmin(true);
};
$("#l-p").addEventListener("keydown",e=>{if(e.key==="Enter")$("#l-go").click()});
function setTheme(t){
  document.documentElement.dataset.theme=t==="light"?"light":"dark";
  try{localStorage.setItem("notes.theme",document.documentElement.dataset.theme)}catch(e){}
}
const flip=()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light");
$("#th").onclick=flip;
$("#y").textContent=new Date().getFullYear();
load();
</script>
</body>
</html>
